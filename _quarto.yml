project:
  type: website
  output-dir: _site
  pre-render: python3 scripts/build_site_data.py
  render:
    - "*.qmd"
    - "!drafts/**"
    - "!books/**"
    - "tech/**/*.qmd"
    - "life-happens/**/*.qmd"
    - "category/**/*.qmd"
    - "tag/**/*.qmd"
    - "20??/**/*.qmd"
  resources:
    - CNAME
    - favicon.ico
    - robots.txt
    - feed.xml
    - assets/**

website:
  title: "Unload Brain"
  description: "Uploading my brain dump."
  site-url: https://unloadbrain.com
  favicon: favicon.ico
  search: true
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: About me
        href: about.qmd
      - text: Projects
        href: projects.qmd
      - text: Life-happens
        href: life-happens.qmd
      - text: Cheatsheet
        href: my-cheatsheet.qmd
      - text: Recipe book
        href: /books/recipes-for-the-amature-husbends/
    right:
      - icon: github
        href: https://github.com/mmahmoodictbd
      - icon: twitter
        href: https://twitter.com/mmahmood_ict_bd
      - icon: linkedin
        href: https://www.linkedin.com/in/mmahmoodictbd
      - icon: rss
        href: /feed.xml
  page-footer:
    left: "© Mossaddeque Mahmood · Uploading my brain dump."
    right:
      - text: Privacy
        href: privacy.qmd

author: Mossaddeque Mahmood
format:
  html:
    from: markdown+emoji
    theme: cosmo
    css: assets/css/quarto.css
