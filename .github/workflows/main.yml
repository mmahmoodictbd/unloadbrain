name: Build and Deploy Quarto to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: quarto render
      - run: quarto render books/recipes-for-the-amature-husbends
      - run: |
          mkdir -p _site/books/recipes-for-the-amature-husbends
          cp -R books/recipes-for-the-amature-husbends/_book/. _site/books/recipes-for-the-amature-husbends/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
